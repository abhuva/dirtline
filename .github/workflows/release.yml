name: Build and publish ROM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release
  cancel-in-progress: true

env:
  BUTANO_COMMIT: c66094ae514c74068f992a4896c5e1f234e9f6e2

jobs:
  build-and-release:
    name: Build and publish latest ROM
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch pinned Butano source
        shell: bash
        run: |
          git clone --depth 1 --branch 21.8.0 https://github.com/GValiente/butano.git .tools/butano
          test "$(git -C .tools/butano rev-parse HEAD)" = "$BUTANO_COMMIT"

      - name: Build toolchain image
        run: docker build --tag dustline-build:1 --file tools/Dockerfile .

      - name: Generate assets and compile ROM
        shell: bash
        run: |
          mkdir -p build
          docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" dustline-build:1 python3 tools/generate_assets.py
          docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" dustline-build:1 make -j4

      - name: Assemble distribution
        shell: bash
        run: |
          mkdir -p dist/licenses
          cp dustline.gba dist/dustline.gba
          cp readme.txt dist/readme.txt
          cp LICENSE dist/LICENSE
          cp .tools/butano/licenses/*.txt dist/licenses/
          sha256sum dist/dustline.gba > dist/dustline.gba.sha256
          (
            cd dist
            zip -r dustline-latest.zip dustline.gba dustline.gba.sha256 readme.txt LICENSE licenses
          )

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Automated playable build from commit [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          Download **dustline.gba** to play directly, or **dustline-latest.zip** for the ROM, play notes, checksum, and third-party notices.
          EOF

          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            dist/dustline.gba \
            dist/dustline.gba.sha256 \
            dist/dustline-latest.zip \
            --target "$GITHUB_SHA" \
            --title "Latest playable build" \
            --notes-file release-notes.md \
            --latest
